<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <h1>🎬 Movie Search App</h1>

        <!-- Search Section -->
        <div class="search-box">

            <input type="text" id="movieInput" placeholder="Search movie...">

            <button id="searchBtn">
                Search
            </button>

        </div>

        <!-- Loading Text -->
        <div id="loader">
            Loading...
        </div>

        <!-- Movie Result -->
        <div id="movieContainer"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
